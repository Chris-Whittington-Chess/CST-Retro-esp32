; Chess System Tal Retro on ESP32 boards.
;   cores3       - the game on the M5Stack CoreS3 (ESP32-S3, 8 MB PSRAM, 320x240 touch), COM3
;   cores3-bench - engine benchmarks / perft suite on the CoreS3
;   cores3-prof  - the benchmarks with search cycle counters
;   ws7          - the game on the Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, GT911
;                  touch, 8 MB OPI PSRAM, 16 MB flash), COM5 = its "USB" socket
; Build/flash:  ..\m5-llm\.venv\Scripts\pio.exe run -e cores3 -t upload
; The engine core (src/engine) is plain C++17 and also builds on the PC
; (build-host.cmd) for perft / key tests.

[platformio]
default_envs = cores3

[env:cores3]
; pinned: arduino-esp32 2.0.17 (the ws7 env uses the pioarduino 3.x platform)
platform = espressif32@7.1.3
board = m5stack-cores3
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
	-O2
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DNNUE_PIE
build_unflags =
	-Os
	-std=gnu++11
build_src_filter = +<engine/> +<cores3/>
lib_deps =
	m5stack/M5Unified
; Jeroen Noomen's Jeroen.bin Polyglot book (668 KB) and the NNUE in flash.
board_build.embed_files =
	data/Jeroen.bin
	data/net.bin

; Engine benchmarks (perft bench + suite, search bench with the TT in PSRAM
; or internal SRAM) on the CoreS3.
[env:cores3-bench]
extends = env:cores3
build_src_filter = +<engine/> +<bench/>
board_build.embed_txtfiles =
	data/perft.epd

; Same firmware with the search cycle counters on (src/engine/profile.h).
[env:cores3-prof]
extends = env:cores3-bench
build_flags =
	${env:cores3.build_flags}
	-DSEARCH_PROFILE

; The bitboard board (-DBITBOARD, src/engine/movegen_bb.cpp) for comparison.
[env:cores3-bench-bb]
extends = env:cores3-bench
build_flags =
	${env:cores3.build_flags}
	-DBITBOARD

[env:cores3-prof-bb]
extends = env:cores3-bench
build_flags =
	${env:cores3.build_flags}
	-DBITBOARD
	-DSEARCH_PROFILE

; Bitboards with GCC's own 64-bit bit scans (ROM calls on the S3), for comparison.
[env:cores3-prof-bb-builtin]
extends = env:cores3-bench
build_flags =
	${env:cores3.build_flags}
	-DBITBOARD
	-DBB_BUILTIN_SCAN
	-DSEARCH_PROFILE

; Waveshare ESP32-S3-Touch-LCD-7: flash through the "USB" socket (COM5); if the
; port is missing, hold BOOT while plugging in (then power-cycle after flashing).
; The "UART" socket cannot flash. Built on arduino-esp32 3.x / ESP-IDF 5
; (pioarduino platform) for the RGB driver's bounce buffers - see lcd_begin().
[env:ws7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env:cores3.build_flags}
build_unflags =
	-Os
	-std=gnu++2b
build_src_filter = +<engine/> +<ws7/> +<cores3/usb_out.cpp>
lib_deps =
	m5stack/M5GFX@0.2.31
board_build.embed_files =
	data/Jeroen.bin
	data/net.bin
